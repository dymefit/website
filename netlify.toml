# Netlify config — Cowork marketing site at "/", React member portal at "/app".
[build]
  # Build the React app into dist/app, then drop the home page + hero at the root.
  command = "npm run build && cp home/index.html dist/index.html && cp public/hero.jpg dist/hero.jpg"
  publish = "dist"
  functions = "netlify/functions"

# API → serverless functions.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Member portal SPA fallback.
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# Env vars (set in Netlify or via CLI):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_COACH_EMAIL
#   RESEND_API_KEY, NOTIFY_FROM, APP_URL
