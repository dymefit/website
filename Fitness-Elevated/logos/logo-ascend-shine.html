<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitness-Elevated — Ascend mark with metallic sheen</title>
<style>
  :root{--bg:#070d14;--blue:#00C2FF;--teal:#2BE0C4;--spring:#6FFFB0;--tx:#E7F3F2;--mut:#7C93A0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Helvetica Neue',Arial,sans-serif;background:
     radial-gradient(800px 420px at 50% -8%,rgba(43,224,196,.12),transparent 60%),var(--bg);
     color:var(--tx);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:48px 20px}
  .eyebrow{color:var(--teal);font-size:12px;font-weight:800;letter-spacing:4px;text-transform:uppercase}
  .icon{width:300px;height:300px;filter:drop-shadow(0 18px 40px rgba(0,194,255,.18))}
  .lockup{width:min(680px,92vw)}
  .row{display:flex;gap:26px;align-items:center;flex-wrap:wrap;justify-content:center}
  .sw{display:flex;gap:10px;align-items:center}
  .dot{width:18px;height:18px;border-radius:5px;border:1px solid rgba(255,255,255,.15)}
  .sw small{color:var(--mut);font-size:12px;letter-spacing:.5px}
  button{font-family:inherit;cursor:pointer;border:1px solid rgba(43,224,196,.4);background:rgba(43,224,196,.08);color:var(--teal);
    font-weight:700;font-size:14px;padding:11px 22px;border-radius:999px;transition:.15s}
  button:hover{background:rgba(43,224,196,.18)}
  .cap{color:var(--mut);font-size:13px;text-align:center;max-width:560px;line-height:1.6}
</style>
</head>
<body>
  <span class="eyebrow">Concept · Ascend · metallic sheen on load</span>

  <!-- ICON -->
  <svg class="icon" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="tealI" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#00C2FF"/><stop offset="0.5" stop-color="#2BE0C4"/><stop offset="1" stop-color="#6FFFB0"/>
      </linearGradient>
      <linearGradient id="shineI" gradientUnits="userSpaceOnUse" x1="-26" y1="48" x2="86" y2="-28" gradientTransform="translate(-220 0)">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.40" stop-color="#fff" stop-opacity="0"/>
        <stop offset="0.50" stop-color="#fff" stop-opacity="1"/><stop offset="0.60" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        <animateTransform attributeName="gradientTransform" type="translate" begin="0s;shineI.end+1.6s"
          values="-220 0; 260 0" dur="1.4s" calcMode="spline" keySplines="0.4 0 0.2 1" fill="freeze"/>
      </linearGradient>
    </defs>
    <rect width="240" height="240" rx="30" fill="#08111A"/>
    <polygon points="120,30 210,120 120,210 30,120" fill="none" stroke="url(#tealI)" stroke-width="6" stroke-linejoin="miter" stroke-miterlimit="10"/>
    <g transform="translate(120,120)" fill="none" stroke="url(#tealI)" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-width="8">
      <path d="M -44 -23 L -13 -54 L -13 54  M -13 0 L -43 0"/>
      <path d="M 44 -23 L 13 -54 L 13 54 L 44 23  M 13 0 L 43 0"/>
    </g>
    <polygon points="120,30 210,120 120,210 30,120" fill="none" stroke="url(#shineI)" stroke-width="6" stroke-linejoin="miter" stroke-miterlimit="10"/>
    <g transform="translate(120,120)" fill="none" stroke="url(#shineI)" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-width="8">
      <path d="M -44 -23 L -13 -54 L -13 54  M -13 0 L -43 0"/>
      <path d="M 44 -23 L 13 -54 L 13 54 L 44 23  M 13 0 L 43 0"/>
    </g>
  </svg>

  <!-- LOCKUP -->
  <svg class="lockup" viewBox="0 0 1040 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="tealL" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#00C2FF"/><stop offset="0.5" stop-color="#2BE0C4"/><stop offset="1" stop-color="#6FFFB0"/>
      </linearGradient>
      <linearGradient id="shineL" gradientUnits="userSpaceOnUse" x1="-60" y1="220" x2="120" y2="60" gradientTransform="translate(-400 0)">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.43" stop-color="#fff" stop-opacity="0"/>
        <stop offset="0.5" stop-color="#fff" stop-opacity="0.95"/><stop offset="0.57" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        <animateTransform attributeName="gradientTransform" type="translate" begin="0.2s;shineL.end+1.4s"
          values="-400 0; 1180 0" dur="1.9s" calcMode="spline" keySplines="0.4 0 0.2 1" fill="freeze"/>
      </linearGradient>
    </defs>
    <!-- mark -->
    <polygon points="150,58 242,150 150,242 58,150" fill="none" stroke="url(#tealL)" stroke-width="6" stroke-linejoin="miter" stroke-miterlimit="10"/>
    <g transform="translate(150,150)" fill="none" stroke="url(#tealL)" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-width="8">
      <path d="M -44 -23 L -13 -54 L -13 54  M -13 0 L -43 0"/>
      <path d="M 44 -23 L 13 -54 L 13 54 L 44 23  M 13 0 L 43 0"/>
    </g>
    <!-- wordmark -->
    <text x="310" y="142" font-family="'Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="2" fill="#EAF3F2">FITNESS</text>
    <text x="312" y="190" font-family="'Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="2" fill="url(#tealL)">ELEVATED</text>
    <text x="313" y="222" font-family="'Helvetica Neue',Arial,sans-serif" font-size="13" letter-spacing="5" fill="#6E8597">A LIFETIME IN MOTION</text>
    <!-- sheen overlay (mark + wordmark) -->
    <polygon points="150,58 242,150 150,242 58,150" fill="none" stroke="url(#shineL)" stroke-width="6" stroke-linejoin="miter" stroke-miterlimit="10"/>
    <g transform="translate(150,150)" fill="none" stroke="url(#shineL)" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-width="8">
      <path d="M -44 -23 L -13 -54 L -13 54  M -13 0 L -43 0"/>
      <path d="M 44 -23 L 13 -54 L 13 54 L 44 23  M 13 0 L 43 0"/>
    </g>
    <text x="310" y="142" font-family="'Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="2" fill="url(#shineL)">FITNESS</text>
    <text x="312" y="190" font-family="'Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="2" fill="url(#shineL)">ELEVATED</text>
  </svg>

  <div class="row">
    <div class="sw"><span class="dot" style="background:#00C2FF"></span><small>#00C2FF Blue</small></div>
    <div class="sw"><span class="dot" style="background:#2BE0C4"></span><small>#2BE0C4 Teal</small></div>
    <div class="sw"><span class="dot" style="background:#6FFFB0"></span><small>#6FFFB0 Spring</small></div>
    <div class="sw"><span class="dot" style="background:#08111A"></span><small>#08111A Navy</small></div>
  </div>
  <button onclick="replay()">↻ Replay sheen</button>
  <p class="cap">Ascend palette · slimmer strokes · F and E spaced with a wider border margin. The metallic highlight sweeps across on load and replays on a loop.</p>

<script>
  function replay(){document.querySelectorAll('animateTransform').forEach(a=>{try{a.beginElement();}catch(e){}});}
  window.addEventListener('load',()=>setTimeout(replay,150));
</script>
</body>
</html>
