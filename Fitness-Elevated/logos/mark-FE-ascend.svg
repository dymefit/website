<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="teal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00C2FF"/><stop offset="0.5" stop-color="#2BE0C4"/><stop offset="1" stop-color="#6FFFB0"/>
    </linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-26" y1="48" x2="86" y2="-28" gradientTransform="translate(-200 0)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.40" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.50" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.60" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-200 0; -200 0; 240 0; 240 0" keyTimes="0; 0.16; 0.62; 1" dur="3.8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="30" fill="#08111A"/>
  <!-- base teal mark (skinny, sharp) -->
  <polygon points="120,30 210,120 120,210 30,120" fill="none" stroke="url(#teal)" stroke-width="6" stroke-linejoin="miter" stroke-miterlimit="10"/>
  <g transform="translate(120,120)" fill="none" stroke="url(#teal)" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-width="8">
    <path d="M -44 -23 L -13 -54 L -13 54  M -13 0 L -43 0"/>
    <path d="M 44 -23 L 13 -54 L 13 54 L 44 23  M 13 0 L 43 0"/>
  </g>
  <!-- metallic sheen overlay -->
  <polygon points="120,30 210,120 120,210 30,120" fill="none" stroke="url(#shine)" stroke-width="6" stroke-linejoin="miter" stroke-miterlimit="10"/>
  <g transform="translate(120,120)" fill="none" stroke="url(#shine)" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-width="8">
    <path d="M -44 -23 L -13 -54 L -13 54  M -13 0 L -43 0"/>
    <path d="M 44 -23 L 13 -54 L 13 54 L 44 23  M 13 0 L 43 0"/>
  </g>
</svg>
