<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="grn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CF29B"/><stop offset="0.55" stop-color="#27C24C"/><stop offset="1" stop-color="#159A37"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="36" fill="#0B0F0C"/>
  <!-- diamond border (explicit vertices, centered) -->
  <polygon points="120,32 208,120 120,208 32,120" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
  <g transform="translate(120,120)">
    <!-- F (white), reaching upward -->
    <rect x="-38" y="-46" width="12" height="54" rx="4" fill="#FFFFFF"/>
    <rect x="-38" y="-46" width="34" height="12" rx="4" fill="#FFFFFF"/>
    <rect x="-38" y="-19" width="28" height="12" rx="4" fill="#FFFFFF"/>
    <!-- E (green), reaching downward -->
    <rect x="6"  y="-8"  width="12" height="54" rx="4" fill="url(#grn)"/>
    <rect x="6"  y="-8"  width="34" height="12" rx="4" fill="url(#grn)"/>
    <rect x="6"  y="19"  width="28" height="12" rx="4" fill="url(#grn)"/>
    <rect x="6"  y="34"  width="34" height="12" rx="4" fill="url(#grn)"/>
  </g>
</svg>
